name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Testes unitários, integração (PGlite) e pgTAP
        run: npm test
      - name: Testes do pipeline de acervo e da relevância curricular (Python)
        run: |
          pip install pypdf
          python -m unittest discover -s scripts/import-enem -p "test_*.py"
          python -m unittest discover -s scripts/curriculum -p "test_*.py"
          python -m unittest discover -s scripts/essay-benchmark -p "test_*.py"
      - run: npm run build
      - name: E2E (Playwright com Chrome do runner)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
